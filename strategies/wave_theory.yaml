instructions: |
  **波浪理论（Elliott Wave Theory）**

  核心：五升三降、三铁律定生死、交替与分形、斐波那契测时空。

  ## 一、基本结构：八浪循环（5推3调）

  使用 `get_daily_history` 获取近 120 日数据，结合 `analyze_trend` 识别浪型：

  ### 推动浪（1-5浪，与主趋势同向）

  - **第1浪**：趋势反转第一波，市场情绪犹豫，成交量温和放大。多数人视为反弹而非反转。
  - **第2浪**：回调浪，回吐第1浪大部分涨幅，成交量萎缩。**不能跌破第1浪起点**（铁律1）。市场信心最弱时恰恰是最佳买点（黄金坑）。
  - **第3浪**：最强劲的推动浪，通常放大量，MACD 强势。**绝不能是最短推动浪**（铁律2）。常为第1浪的 1.618~2.618 倍延伸，最安全做多区间。
  - **第4浪**：整理浪，形态常与第2浪交替（交替原则）。回调较浅，**低点不能与第1浪高点重叠**（铁律3，股票市场）。成交量减少，次优买点。
  - **第5浪**：末段推动，动能减弱，成交量弱于第3浪。顶背离预示行情结束。目标≈第1浪或第3浪的 0.618~1 倍。

  ### 调整浪（A-B-C浪，逆主趋势）

  - **A浪**：第一次下跌，成交量较大。多数人仍视为正常回调，未意识到趋势已转。
  - **B浪**：反弹浪，力度弱于前期涨幅，成交量萎缩。诱多陷阱风险极高，不宜重仓。
  - **C浪**：杀伤力最大的主跌段，力度往往超过 A 浪，成交量放大。目标：A 浪顶端起算，等于或超过 A 浪长度。

  ## 二、三大铁律（绝对不能违反，否则需重新数浪）

  1. **2浪不能跌破1浪起点** — 若跌破，当前数浪不成立，需降级或重新归数。
  2. **3浪不能是最短的推动浪** — 1、3、5 中 3 浪通常最长；若 3 浪最短，数浪无效。
  3. **4浪低点不能与1浪高点重叠** — 股票市场严格禁止；期货/杠杆市场允许短暂重叠。

  ## 三、重要指导原则（非铁律，但高概率成立）

  ### 交替原则
  2浪与4浪在形态上交替出现：2浪简单锯齿 → 4浪复杂平台/三角；反之亦然。

  ### 延伸原则
  1、3、5 中常有一浪延长（最常见第3浪延长）。延长浪内部可再细分 5 子浪。延长浪出现后，另两浪时间和幅度趋于等长或呈斐波那契比例。

  ### 分形原则
  大浪套小浪，各级别结构自相似（周线→日线→小时线→分钟线均适用）。推动浪内部由更小级别 5 浪组成，调整浪内部由更小级别 3 浪组成。

  ## 四、斐波那契比例（核心数学基础）

  ### 回调位（判断2浪、4浪、B浪终点）
  | 比例 | 含义 |
  |------|------|
  | 0.382 | 浅回调，趋势强劲 |
  | 0.5 | 中等回调，常见平衡位 |
  | 0.618 | 深回调，黄金分割位，最关键支撑/阻力 |

  ### 推动位（预测3浪、5浪目标）
  | 比例 | 含义 |
  |------|------|
  | 1.618 | 3浪常见目标 ≈ 1浪 × 1.618 |
  | 2.618 | 3浪强势延伸目标 ≈ 1浪 × 2.618 |
  | 0.618 | 5浪目标 ≈ 1浪或3浪 × 0.618 |
  | 1.0 | 5浪与1浪等长（无延伸时常见） |

  ### 时间窗口
  转折点常出现在斐波那契时间窗口（5、8、13、21、34、55 个交易日），与价格斐波那契位共振时信号最强。

  ## 五、最优买点

  - **第2浪回调企稳（黄金坑）**：最安全买点，止损设第1浪起点下方。
  - **第3浪初期突破**：放量突破第1浪高点时介入，最理想主升浪买点。
  - **第4浪回调企稳**：次优买点，止损设第1浪顶部，需确认与第1浪无重叠。
  - **禁止操作**：第5浪末端追高（顶背离风险）、B浪反弹重仓（诱多陷阱）、C浪下跌中途抄底。

  ## 六、风险提示

  - 波浪计数存在主观性（"千人千浪"），需结合 MACD、成交量和其他指标交叉验证。
  - 三大铁律任何一条违反，必须重新归数，不可强行套用。
  - B 浪反弹不宜重仓（陷阱性质）。
  - 调整浪形态多变（锯齿、平台、三角、联合形），单一形态判断易出错。

  ## 七、输出要求

  - 给出当前可能的浪型位置（如"第3浪中段"、"疑似第4浪调整"）。
  - 给出完整斐波那契支撑/阻力位（0.382 / 0.5 / 0.618 / 1.618 / 2.618）。
  - 逐条验证三大铁律（通过/违反）。
  - 标注当前浪型是否匹配交替原则和分形结构。
  - 说明当前是买入时机、等待机会还是规避。
  - 给出波浪计数的置信度（高/中/低）并说明依据。

  评分调整建议：
  - 第2浪底部企稳（黄金坑，铁律全通过）：`sentiment_score +15`
  - 第3浪突破确认（放量+不最短）：`sentiment_score +12`
  - 第5浪末端/顶背离：`sentiment_score -10`
  - C浪下跌中：`sentiment_score -12`
  - 铁律违反/数浪混乱：`sentiment_score -20`
